<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232c2c">
<title>My Flower Patch</title>
<meta name="description" content="Welcome to my flower patch — a cozy little portfolio garden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a2414;
    --plank: #c49a63;
    --plank-dark: #7b4a32;
    --plank-light: #e0bd85;
    --parchment: #f7ecd2;
    --forest: #232c2c;
    --cream: #fff5d7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--forest); }
  body { font-family: "Nunito", system-ui, sans-serif; color: var(--ink); }

  .screen { position: fixed; inset: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  .stage {
    position: absolute; left: -3%; top: -3%; width: 106%; height: 106%;
    will-change: transform;
  }
  .stage > svg { width: 100%; height: 100%; display: block; }

  /* ============ COVER ============ */
  #cover { z-index: 2; transition: opacity 1s ease, transform 1.2s cubic-bezier(.6,0,.3,1), filter 1s ease; }
  #cover.leaving { opacity: 0; transform: scale(1.12); filter: blur(6px); pointer-events: none; }
  #cover.gone { display: none; }
  .cover-copy {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: clamp(1.2rem, 3vh, 2rem); text-align: center; padding: 1.5rem;
  }
  .cover-copy h1 {
    margin: 0; font-family: "Gaegu", cursive; font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 5.6rem); line-height: .95; color: #2f3a26;
    text-shadow: 0 2px 0 rgba(255,245,215,.8), 0 0 30px rgba(255,245,215,.9);
    animation: rise 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  .cover-copy h1 span { display: block; font-size: .55em; font-weight: 400; color: #5b6b3a; }
  .plank-btn {
    font-family: "Gaegu", cursive; font-weight: 700; font-size: clamp(1.5rem, 2.6vw, 2rem);
    color: var(--ink); background: linear-gradient(180deg, var(--plank-light), var(--plank));
    border: 4px solid var(--plank-dark); border-radius: 18px 26px 16px 24px / 22px 16px 26px 18px;
    padding: .35em 1.4em .45em; cursor: pointer;
    box-shadow: 0 6px 0 var(--plank-dark), 0 14px 28px rgba(40,20,5,.35);
    transition: transform .2s ease, box-shadow .2s ease;
    animation: rise 1.4s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .plank-btn:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 9px 0 var(--plank-dark), 0 18px 32px rgba(40,20,5,.35); }
  .plank-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--plank-dark), 0 8px 18px rgba(40,20,5,.3); }
  .plank-btn:focus-visible { outline: 3px dashed var(--cream); outline-offset: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

  .cv-bob { transform-box: fill-box; transform-origin: 50% 50%; animation: cvBob 6s ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes cvBob { from { transform: rotate(-6deg) scale(.97); } to { transform: rotate(6deg) scale(1.03); } }
  .cv-twinkle { animation: twinkle 7s ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes twinkle { from { opacity: 1; } to { opacity: .55; } }

  /* ============ GARDEN ============ */
  #garden { z-index: 1; opacity: 0; filter: blur(4px); transition: opacity 1.4s ease .2s, filter 1.4s ease .2s; }
  #garden.awake { opacity: 1; filter: none; }

  /* Trees */
  .sway-tree { transform-box: view-box; transform-origin: 1700px 860px; animation: treeSway 9s ease-in-out infinite alternate; }
  @keyframes treeSway { from { transform: rotate(-.35deg); } to { transform: rotate(.35deg); } }
  .sway-soft { transform-box: fill-box; transform-origin: 50% 100%; animation: soft 8s ease-in-out infinite alternate; }
  .sway-soft.d2 { animation-delay: -3s; }
  @keyframes soft { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
  .branch { transform-box: view-box; transform-origin: -60px 480px; animation: branch 11s ease-in-out infinite alternate; }
  @keyframes branch { from { transform: rotate(-.45deg); } to { transform: rotate(.4deg); } }
  .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: leaf 7s ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes leaf { from { transform: rotate(calc(var(--a) * -1)); } to { transform: rotate(var(--a)); } }
  .sunray { animation: rays 8s ease-in-out infinite alternate; }
  @keyframes rays { from { opacity: .14; } to { opacity: .34; } }

  /* Bushes, grass, flowers */
  .bush-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 9s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(1, 1); } to { transform: scale(1.006, 1.018); } }
  .bush-l { transform-box: view-box; transform-origin: 1760px 1120px; animation: bush 10s ease-in-out infinite alternate; }
  .bush-r { transform-box: view-box; transform-origin: 300px 1120px; animation: bush 10s ease-in-out -5s infinite alternate; }
  @keyframes bush { from { transform: rotate(-.6deg); } to { transform: rotate(.6deg); } }
  .bloom { transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 5s ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes bloom { from { transform: rotate(-7deg) scale(.97); } to { transform: rotate(7deg) scale(1.04); } }
  .tuft { transform-box: fill-box; transform-origin: 50% 100%; animation: tuft var(--t, 4s) ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes tuft { from { transform: skewX(calc(var(--a) * -1)); } to { transform: skewX(var(--a)); } }

  /* Butterfly */
  .butterfly { transform-box: view-box; animation: flutter 7s ease-in-out infinite; }
  @keyframes flutter {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(10px, -14px); }
    50% { transform: translate(-4px, -22px); }
    75% { transform: translate(-12px, -6px); }
  }
  .wing { transform-box: view-box; transform-origin: 1347px 560px; animation: flap .55s ease-in-out infinite alternate; }
  .wing-r { animation-delay: -.05s; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.55); } }

  /* Person */
  .writing-hand { transform-box: view-box; transform-origin: 1440px 700px; animation: write 3.4s ease-in-out infinite; }
  @keyframes write {
    0%   { transform: translate(0, 0) rotate(0deg); }
    8%   { transform: translate(2px, 2px) rotate(.6deg); }
    16%  { transform: translate(4px, 0) rotate(-.4deg); }
    24%  { transform: translate(6px, 2.2px) rotate(.6deg); }
    32%  { transform: translate(8px, .4px) rotate(-.4deg); }
    40%  { transform: translate(10px, 2.4px) rotate(.6deg); }
    48%  { transform: translate(12px, .6px) rotate(-.4deg); }
    56%  { transform: translate(14px, 2.6px) rotate(.5deg); }
    64%  { transform: translate(15px, 1px) rotate(0deg); }
    76%  { transform: translate(9px, 3.5px) rotate(-1deg); }
    88%  { transform: translate(2px, 2px) rotate(-.4deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .blink { transform-box: view-box; animation: blink 6.5s ease-in-out infinite; }
  .blink-r { transform-origin: 1490px 625px; }
  .blink-l { transform-origin: 1543px 628px; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }

  /* Ambient light */
  .glow { animation: glow 7s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: 1; } to { opacity: .72; } }

  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .warm {
    background: radial-gradient(ellipse 70% 60% at 68% 52%, rgba(255,190,110,.22), transparent 70%);
    mix-blend-mode: soft-light; animation: warm 10s ease-in-out infinite alternate;
  }
  @keyframes warm { from { opacity: .8; } to { opacity: 1; } }
  .vignette { background: radial-gradient(ellipse 90% 85% at 55% 50%, transparent 55%, rgba(28,18,10,.5) 100%); }
  .cursor-light {
    width: 720px; height: 720px; left: -360px; top: -360px; inset: auto;
    background: radial-gradient(circle, rgba(255,214,150,.20), rgba(255,214,150,.06) 40%, transparent 68%);
    mix-blend-mode: screen; will-change: transform; opacity: 0; transition: opacity 1s;
  }
  .cursor-light.on { opacity: 1; }
  #motes { width: 100%; height: 100%; }

  /* Signs */
  .sign { fill: #ffe6b0; fill-opacity: 0; cursor: pointer; transition: fill-opacity .25s ease; outline: none; }
  .sign:hover { fill-opacity: .16; }
  .sign:focus-visible { fill-opacity: .16; stroke: var(--cream); stroke-width: 6; stroke-dasharray: 18 12; }

  .hint {
    position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%);
    font-family: "Gaegu", cursive; font-size: 1.35rem; color: var(--cream);
    background: rgba(35,44,44,.45); padding: .25em .9em; border-radius: 999px;
    opacity: 0; transition: opacity 1s; pointer-events: none; white-space: nowrap;
  }
  .hint.show { opacity: 1; }

  /* Panels (About / Portfolio / Contact) */
  .panel-wrap {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 1.5rem;
    background: rgba(25,18,10,.45);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .panel-wrap.open { opacity: 1; pointer-events: auto; }
  .panel-wrap { padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
  .panel {
    position: relative; width: min(560px, 100%); max-height: 82vh; max-height: 82dvh; overflow: auto;
    background: var(--parchment); border: 4px solid var(--plank-dark);
    border-radius: 22px 30px 20px 28px / 28px 20px 30px 22px;
    padding: 2rem 2rem 1.6rem; box-shadow: 0 8px 0 var(--plank-dark), 0 24px 50px rgba(20,10,0,.45);
    transform: translateY(20px) rotate(-.5deg); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .panel-wrap.open .panel { transform: none; }
  .panel h2 { font-family: "Gaegu", cursive; font-size: 2.6rem; margin: 0 0 .4rem; line-height: 1; }
  .panel p { line-height: 1.6; margin: .6rem 0; }
  .panel .close {
    position: absolute; top: .7rem; right: .9rem; border: 0; background: none; cursor: pointer;
    font-family: "Gaegu", cursive; font-size: 2rem; line-height: 1; color: var(--plank-dark);
  }
  .panel .close:focus-visible { outline: 2px dashed var(--plank-dark); }
  .panel section[hidden] { display: none; }
  .panel.wide { width: min(1120px, 100%); max-height: 88vh; max-height: 88dvh; }

  /* Portfolio gallery */
  .filters { display: flex; flex-wrap: wrap; gap: .45rem; margin: .4rem 0 1.2rem; }
  .filters button {
    font: 600 .95rem "Nunito", sans-serif; color: var(--ink); cursor: pointer;
    background: transparent; border: 2px solid var(--plank-dark); border-radius: 999px; padding: .3em .95em;
    transition: background .2s, color .2s;
  }
  .filters button[aria-pressed="true"] { background: var(--plank-dark); color: var(--cream); }
  .filters button:focus-visible { outline: 2px dashed var(--plank-dark); outline-offset: 3px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .card {
    display: block; width: 100%; text-align: left; padding: 0; cursor: pointer; font: inherit; color: inherit;
    background: #fffaf0; border: 2px solid #d9bf93; border-radius: 14px; overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px) rotate(-.4deg); border-color: var(--plank-dark); box-shadow: 0 8px 18px rgba(60,30,10,.22); outline: none; }
  .card .thumb { position: relative; aspect-ratio: 4 / 5; background: #eadcbf; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .count {
    position: absolute; right: .5rem; bottom: .5rem; font-size: .75rem; font-weight: 700;
    background: rgba(35,25,15,.72); color: var(--cream); padding: .15em .6em; border-radius: 999px;
  }
  .card .meta { padding: .6rem .75rem .75rem; }
  .card .meta strong { display: block; font-family: "Gaegu", cursive; font-size: 1.45rem; line-height: 1.05; }
  .card .meta span { font-size: .82rem; color: #7a5a3e; }
  .gallery-note { font-size: .85rem; color: #7a5a3e; margin-top: 1.2rem; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 7; display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    background: rgba(18,13,8,.97); opacity: 0; pointer-events: none; transition: opacity .3s ease;
    padding: max(.75rem, env(safe-area-inset-top)) .5rem max(.75rem, env(safe-area-inset-bottom));
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox figure { margin: 0; display: grid; justify-items: center; gap: .9rem; min-width: 0; touch-action: pan-y; }
  .lightbox img { max-width: 100%; max-height: 74vh; max-height: 74dvh; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lightbox figcaption { color: var(--cream); text-align: center; max-width: 640px; padding: 0 .5rem; }
  .lightbox figcaption strong { font-family: "Gaegu", cursive; font-size: 1.8rem; line-height: 1; display: block; }
  .lightbox figcaption .lb-meta { font-size: .9rem; opacity: .8; }
  .lightbox figcaption p { font-size: .92rem; line-height: 1.5; margin: .45rem 0 0; opacity: .92; }
  .lightbox figcaption a { color: #ffd98a; }
  .lightbox .lb-cap { display: block; font-size: .85rem; opacity: .7; margin-top: .3rem; }
  .lb-btn {
    border: 0; background: rgba(255,245,215,.12); color: var(--cream); cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%; font-size: 1.6rem; line-height: 1;
    display: grid; place-items: center; transition: background .2s;
  }
  .lb-btn:hover, .lb-btn:focus-visible { background: rgba(255,245,215,.25); outline: none; }
  .lb-btn[hidden] { visibility: hidden; display: grid; }
  .lb-close { position: absolute; top: max(.75rem, env(safe-area-inset-top)); right: .75rem; }
  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: .7rem; }
    .card .meta strong { font-size: 1.2rem; }
    .lightbox { grid-template-columns: 1fr; }
    .lightbox .lb-prev, .lightbox .lb-next { position: absolute; bottom: max(1rem, env(safe-area-inset-bottom)); }
    .lightbox .lb-prev { left: 1rem; } .lightbox .lb-next { right: 1rem; }
    .lightbox figure { padding-bottom: 3.5rem; }
  }
  body.paused #scene-svg * { animation-play-state: paused !important; }

  /* ============ MOBILE ============ */
  .sign { -webkit-tap-highlight-color: transparent; }
  /* Tall/narrow screens: the scene keeps its shape and you swipe to look around */
  .portrait #garden { touch-action: none; cursor: grab; }
  .portrait #scene-stage { will-change: transform; }
  .mnav {
    position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%); display: none; gap: .5rem; z-index: 3;
  }
  .portrait .mnav { display: flex; }
  .mnav .plank-btn {
    font-size: 1.25rem; padding: .2em .75em .3em; border-width: 3px; white-space: nowrap;
    box-shadow: 0 4px 0 var(--plank-dark), 0 8px 18px rgba(40,20,5,.35); animation: none;
  }
  .portrait .hint { bottom: calc(86px + env(safe-area-inset-bottom)); font-size: 1.2rem; }
  @media (hover: none) { .cursor-light { display: none; } }
  @media (max-width: 600px) {
    .panel { padding: 1.6rem 1.25rem 1.3rem; }
    .panel h2 { font-size: 2.1rem; padding-right: 1.5rem; }
    .cover-copy h1 { font-size: clamp(2.6rem, 12vw, 3.6rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>

      <h2>Contact</h2>
      <p>Ways to reach me will be planted here.</p>
    </section>
  </div>
</div>

<!-- =============== ARTWORK VIEWER =============== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous image">&lsaquo;</button>
  <figure id="lb-figure">
    <img id="lb-img" alt="">
    <figcaption>
      <strong id="lb-title"></strong>
      <span class="lb-meta" id="lb-meta"></span>
      <span class="lb-cap" id="lb-cap"></span>
      <p id="lb-desc"></p>
    </figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next image">&rsaquo;</button>
</div>

<script>
/* =========================================================
   PORTFOLIO — to add a piece, copy one block below.
   Images live in the /portfolio folder: name.webp + name-thumb.webp
   cat: "digital" | "design" | "3d"
   ========================================================= */
const WORKS = [
  { cat: 'digital', title: 'Allain', kind: 'Character illustration', images: ['allain'] },
  { cat: 'digital', title: 'Diffy', kind: 'Character illustration', images: ['diffy'] },
  { cat: 'digital', title: 'Oleander', kind: 'Character illustration', images: ['oleander'] },
  { cat: 'digital', title: 'In the Pool', kind: 'Character illustration', images: ['in-the-pool'] },
  { cat: 'digital', title: 'Evelynn', kind: 'Character sheet', images: ['evelynn'] },
  { cat: 'digital', title: 'Triton', kind: 'Character sheet', images: ['triton'] },
  { cat: 'design', title: 'Bitcamp Hackathon', kind: 'Mural & social media design',
    images: ['bitcamp-mural', 'bitcamp-7-days', 'bitcamp-6-days', 'bitcamp-holidays'],
    captions: ['Community mural mockup', '7 days countdown post', '6 days countdown post', 'Holiday post'] },
  { cat: '3d', title: 'Blind Faith', kind: 'Wearables', year: 2025,
    materials: 'Creative air-dry paper clay, beads, wire, paint, sculpting knife, hot glue, paper mask, tape',
    desc: 'The back contains scribbled writings of an Our Father, Hail Mary, Glory Be, and parts of a Hail Holy Queen.',
    images: ['blind-faith-1', 'blind-faith-2', 'blind-faith-3'],
    captions: ['Submitted piece for critique', 'Submitted piece for critique', 'The back, with handwritten prayers'] },
  { cat: '3d', title: 'Gaksa Ko', kind: 'Tactile sound sculpture', year: 2025,
    materials: 'All-purpose flour, masking tape, water, puck speaker, wires, amp',
    desc: 'When the viewer lays their head on the sculpture, they will hear and feel the vibrations of a calm heartbeat and my mother singing a Cebuano lullaby.',
    images: ['gaksa-ko-1', 'gaksa-ko-2', 'gaksa-ko-3', 'gaksa-ko-4', 'gaksa-ko-5', 'gaksa-ko-6', 'gaksa-ko-7', 'gaksa-ko-8'],
    captions: ['Submitted piece for critique', 'Submitted piece for critique', 'Submitted piece for critique',
               'Work in progress', 'Work in progress', 'Work in progress', 'Work in progress', 'Work in progress'] },
  { cat: '3d', title: 'Falling in Shadow', kind: 'Light & space', year: 2025,
    materials: 'Small motor, 2 AA batteries, wires, switch, cardboard',
    links: [['Watch video 1', 'https://drive.google.com/file/d/1uMkD3EMAyEbZ-ta3SKPbG2F04kmW5KoO/view?usp=sharing'],
            ['Watch video 2', 'https://drive.google.com/file/d/1zSfTk9pD7kQzw7qiCspLei7QEOMS9Iq7/view?usp=sharing']],
    images: ['falling-in-shadow-1', 'falling-in-shadow-2'],
    captions: ['Submitted piece for critique', 'Submitted piece for critique'] },
  { cat: '3d', title: 'A Childish Lung', kind: 'Multiples', year: 2024,
    materials: 'Post-it notes, tape, acrylic paint, pipe cleaner, hot glue',
    images: ['childish-lung-1', 'childish-lung-2', 'childish-lung-3', 'childish-lung-4', 'childish-lung-5', 'childish-lung-6',
             'childish-lung-7', 'childish-lung-8', 'childish-lung-9', 'childish-lung-10', 'childish-lung-11', 'childish-lung-12'],
    captions: ['Submitted piece for critique', 'Submitted piece for critique', 'Original sketch',
               'Rolled and painted Post-it notes', 'Rolled and painted Post-it notes',
               'The stages of forming the base', 'The stages of forming the base', 'The stages of forming the base',
               'Finished product with lung and lung cover', 'Finished product with lung and lung cover',
               'Finished product with lung and lung cover', 'Finished product with lung and lung cover'] },
];

(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cover = document.getElementById('cover');
  const garden = document.getElementById('garden');
  const coverStage = document.getElementById('cover-stage');
  const layers = [...document.querySelectorAll('#scene-svg .px')].map(g => ({ g, d: +g.dataset.d }));
  const light = document.getElementById('cursor-light');
  const hint = document.getElementById('hint');
  const sceneStage = document.getElementById('scene-stage');
  const coarse = matchMedia('(pointer: coarse)').matches;
  let inGarden = false;

  /* ---------- layout: wide screens see everything, tall screens pan ---------- */
  let portrait = false, panX = 0, panTarget = 0, panMax = 0, panVel = 0, panFrac = 0.79;
  function layout() {
    const was = portrait;
    portrait = innerWidth / innerHeight < 1.25;
    document.documentElement.classList.toggle('portrait', portrait);
    if (portrait) {
      const h = innerHeight * 1.06, w = h * 16 / 9;
      Object.assign(sceneStage.style, { width: w + 'px', height: h + 'px', left: '0px', top: (-innerHeight * .03) + 'px' });
      panMax = Math.max(0, w - innerWidth);
      // start centred on the person writing (≈79% across the scene)
      panTarget = panX = Math.min(panMax, Math.max(0, w * panFrac - innerWidth / 2));
      sceneStage.style.transform = `translate3d(${-panX}px,0,0)`;
    } else if (was) {
      Object.assign(sceneStage.style, { width: '', height: '', left: '', top: '', transform: '' });
    }
  }
  layout();
  addEventListener('resize', layout);
  function showHint() {
    hint.textContent = portrait ? 'swipe to look around' : 'pick a sign to explore';
    setTimeout(() => hint.classList.add('show'), 1800);
    setTimeout(() => hint.classList.remove('show'), portrait ? 6000 : 7000);
  }

  /* ---------- swipe to pan (tall screens) ---------- */
  let dragId = null, dragX0 = 0, pan0 = 0, lastX = 0, lastT = 0, dragged = false;
  garden.addEventListener('pointerdown', e => {
    dragged = false;
    if (!portrait || e.target.closest('.mnav')) return;
    dragId = e.pointerId; dragX0 = lastX = e.clientX; lastT = performance.now();
    pan0 = panTarget; panVel = 0; dragged = false;
  });
  addEventListener('pointermove', e => {
    if (e.pointerId !== dragId) return;
    const dx = e.clientX - dragX0;
    if (Math.abs(dx) > 8) dragged = true;
    const now = performance.now();
    panVel = -(e.clientX - lastX) / Math.max(1, now - lastT) * 16;
    lastX = e.clientX; lastT = now;
    panTarget = Math.min(panMax, Math.max(0, pan0 - dx));
  });
  const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
  addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
  // a swipe that ends on a sign shouldn't count as tapping it
  garden.addEventListener('click', e => { if (dragged && !e.target.closest('.mnav')) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);

  /* ---------- cover → garden ---------- */
  function enterGarden() {
    if (inGarden) return;
    inGarden = true;
    cover.classList.add('leaving');
    garden.classList.add('awake');
    setTimeout(() => cover.classList.add('gone'), 1300);
    showHint();
    try { history.replaceState(null, '', '#garden'); } catch (e) { /* previews/iframes can block this; harmless */ }
  }
  document.getElementById('continue').addEventListener('click', enterGarden);
  if (location.hash === '#garden') { cover.classList.add('gone'); garden.classList.add('awake'); inGarden = true; }

  /* ---------- camera follows the cursor (parallax) ---------- */
  let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = -1e9, mouseX = innerWidth / 2, mouseY = innerHeight / 2, lx = mouseX, ly = mouseY;
  addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    tx = (e.clientX / innerWidth - .5) * 2;
    ty = (e.clientY / innerHeight - .5) * 2;
    mouseX = e.clientX; mouseY = e.clientY;
    lastMove = performance.now();
    light.classList.add('on');
  });
  document.addEventListener('pointerleave', () => { tx = ty = 0; light.classList.remove('on'); });

  // How far each layer can travel, in SVG units (scene is 1920 wide)
  const RANGE_X = 46, RANGE_Y = 26;

  /* ---------- fireflies / dust motes ---------- */
  const canvas = document.getElementById('motes');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1, motes = [];
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = 64;
  { const s = sprite.getContext('2d'); const gr = s.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,248,200,1)'); gr.addColorStop(.25, 'rgba(255,220,130,.75)');
    gr.addColorStop(1, 'rgba(255,180,80,0)'); s.fillStyle = gr; s.fillRect(0, 0, 64, 64); }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, coarse ? 1.5 : 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(46, (W * H) / 38000));
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: H * (.15 + Math.random() * .8),
      r: 4 + Math.random() * 10, vx: (Math.random() - .5) * .25, vy: -.08 - Math.random() * .2,
      ph: Math.random() * 6.28, sp: .6 + Math.random() * 1.4, d: .4 + Math.random() * .7
    }));
  }
  resize(); addEventListener('resize', resize);

  function drawMotes(t, ox, oy) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      m.x += m.vx + Math.sin(t * .0004 * m.sp + m.ph) * .25;
      m.y += m.vy + Math.cos(t * .0005 * m.sp + m.ph) * .15;
      if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
      if (m.x < -20) m.x = W + 20; else if (m.x > W + 20) m.x = -20;
      const a = .25 + .75 * Math.max(0, Math.sin(t * .0012 * m.sp + m.ph));
      ctx.globalAlpha = a * .8;
      const s = m.r * 2;
      ctx.drawImage(sprite, m.x - ox * m.d - m.r, m.y - oy * m.d - m.r, s, s);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- main loop ---------- */
  function frame(t) {
    // drift gently when the mouse is idle (or on touch screens)
    let gx = tx, gy = ty;
    if (reduced) { gx = gy = 0; }
    else if (t - lastMove > 4000) { gx = Math.sin(t * .00025) * .35; gy = Math.cos(t * .0002) * .2; }
    cx += (gx - cx) * .045; cy += (gy - cy) * .045;

    if (portrait) {
      if (dragId === null && Math.abs(panVel) > .05) { panTarget = Math.min(panMax, Math.max(0, panTarget + panVel)); panVel *= .92; }
      panX += (panTarget - panX) * .25;
      if (panMax) panFrac = (panX + innerWidth / 2) / (panMax + innerWidth);
      sceneStage.style.transform = `translate3d(${(-panX).toFixed(1)}px,0,0)`;
    }
    if (reduced || document.body.classList.contains('paused')) { requestAnimationFrame(frame); return; }
    if (!inGarden) {
      coverStage.style.transform = `translate(${-cx * 14}px, ${-cy * 9}px)`;
    } else {
      for (const { g, d } of layers) g.setAttribute('transform', `translate(${(-cx * RANGE_X * d).toFixed(2)} ${(-cy * RANGE_Y * d).toFixed(2)})`);
      lx += (mouseX - lx) * .12; ly += (mouseY - ly) * .12;
      light.style.transform = `translate(${lx}px, ${ly}px)`;
      drawMotes(t, cx * 22, cy * 13);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- sign panels ---------- */
  const wrap = document.getElementById('panel-wrap');
  const sections = [...wrap.querySelectorAll('section[data-panel]')];
  const panelEl = wrap.querySelector('.panel');

  /* ---------- portfolio gallery ---------- */
  const IMG = n => `portfolio/${n}.webp`, THUMB = n => `portfolio/${n}-thumb.webp`;
  const gallery = document.getElementById('gallery');
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  WORKS.forEach((w, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.dataset.cat = w.cat;
    b.innerHTML = `<div class="thumb"><img src="${THUMB(w.images[0])}" alt="${esc(w.title)}" loading="lazy" decoding="async">` +
      (w.images.length > 1 ? `<span class="count">${w.images.length} photos</span>` : '') +
      `</div><div class="meta"><strong>${esc(w.title)}</strong><span>${esc(w.kind)}${w.year ? ' · ' + w.year : ''}</span></div>`;
    b.addEventListener('click', () => openLightbox(i, 0));
    gallery.appendChild(b);
  });
  document.querySelectorAll('#filters button').forEach(f => f.addEventListener('click', () => {
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === f));
    gallery.querySelectorAll('.card').forEach(c => { c.hidden = f.dataset.cat !== 'all' && c.dataset.cat !== f.dataset.cat; });
  }));

  /* ---------- artwork viewer ---------- */
  const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img');
  const lbPrev = document.getElementById('lb-prev'), lbNext = document.getElementById('lb-next');
  let cur = 0, idx = 0, lbFocus = null;
  function showImage() {
    const w = WORKS[cur], n = w.images.length;
    lbImg.src = IMG(w.images[idx]);
    lbImg.alt = w.title + (w.captions ? ' — ' + w.captions[idx] : '');
    document.getElementById('lb-title').textContent = w.title;
    document.getElementById('lb-meta').textContent = [w.kind, w.year].filter(Boolean).join(' · ') + (w.materials ? ' — ' + w.materials : '');
    document.getElementById('lb-cap').textContent = (w.captions ? w.captions[idx] : '') + (n > 1 ? `  (${idx + 1} / ${n})` : '');
    const d = document.getElementById('lb-desc');
    d.innerHTML = (w.desc ? esc(w.desc) : '') + (w.links ? (w.desc ? '<br>' : '') + w.links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(' · ') : '');
    lbPrev.hidden = lbNext.hidden = n < 2;
    if (n > 1) { const pre = new Image(); pre.src = IMG(w.images[(idx + 1) % n]); }
  }
  function openLightbox(i, j) { lbFocus = document.activeElement; cur = i; idx = j; showImage(); lb.classList.add('open'); document.getElementById('lb-close').focus(); }
  function closeLightbox() { lb.classList.remove('open'); lbFocus && lbFocus.focus && lbFocus.focus(); }
  function step(d) { const n = WORKS[cur].images.length; if (n < 2) return; idx = (idx + d + n) % n; showImage(); }
  lbPrev.addEventListener('click', () => step(-1));
  lbNext.addEventListener('click', () => step(1));
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  let sx = null;
  const fig = document.getElementById('lb-figure');
  fig.addEventListener('pointerdown', e => { sx = e.clientX; });
  fig.addEventListener('pointerup', e => { if (sx !== null && Math.abs(e.clientX - sx) > 50) step(e.clientX < sx ? 1 : -1); sx = null; });
  let lastFocus = null;
  function openPanel(id) {
    lastFocus = document.activeElement;
    sections.forEach(s => { s.hidden = s.dataset.panel !== id; if (!s.hidden) s.querySelector('h2').id = 'panel-title'; else s.querySelector('h2').removeAttribute('id'); });
    wrap.classList.add('open');
    panelEl.classList.toggle('wide', id === 'portfolio');
    document.body.classList.add('paused');
    document.getElementById('panel-close').focus();
  }
  function closePanel() { wrap.classList.remove('open'); document.body.classList.remove('paused'); lastFocus && lastFocus.focus && lastFocus.focus(); }
  document.querySelectorAll('.mnav [data-panel]').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.panel)));
  document.querySelectorAll('.sign').forEach(s => {
    s.addEventListener('click', () => openPanel(s.dataset.panel));
    s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(s.dataset.panel); } });
  });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  wrap.addEventListener('click', e => { if (e.target === wrap) closePanel(); });
  addEventListener('keydown', e => {
    if (lb.classList.contains('open')) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      return;
    }
    if (e.key === 'Escape' && wrap.classList.contains('open')) closePanel();
  });
})();
</script>
